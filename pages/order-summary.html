{% layout 'theme' %}

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background-color: #E8F5E9;
    color: #333;
    line-height: 1.6;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  .header {
    background-color: #B8E6D3;
    padding: 20px;
    margin-bottom: 30px;
    border-radius: 8px;
  }

  .header h1 {
    color: #333;
    font-size: 28px;
    font-weight: bold;
  }

  .content {
    display: flex;
    gap: 48px;
    align-items: flex-start;
  }

  @media (max-width: 968px) {
    .content {
      flex-direction: column;
      gap: 24px;
    }
  }

  .preview-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .preview-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 24px;
    color: #333;
    text-align: center;
  }

  .preview-container {
    width: 100%;
    max-width: 500px;
    height: 500px;
    position: relative;
    background-color: #e0e0e0;
    border: 2px solid #B8E6D3;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  }

  #previewCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .order-details-section {
    flex: 1;
    padding-top: 24px;
  }

  .detail-row {
    display: flex;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .detail-label {
    width: 120px;
    color: #666;
    font-size: 16px;
  }

  .detail-value {
    flex: 1;
    font-weight: bold;
    color: #333;
    font-size: 16px;
  }

  .total-price-container {
    margin-top: 24px;
    padding: 16px;
    background-color: rgba(184, 230, 211, 0.3);
    border-radius: 12px;
  }

  .total-price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .total-price-label {
    font-size: 20px;
    font-weight: bold;
    color: #333;
  }

  .total-price-value {
    font-size: 24px;
    font-weight: bold;
    color: #333;
  }

  .continue-button {
    width: 100%;
    margin-top: 32px;
    padding: 16px;
    background-color: #FF6B9D;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .continue-button:hover {
    background-color: #E55A8A;
  }

  .continue-button:active {
    transform: scale(0.98);
  }
</style>

<div class="container">
  <div class="header">
    <h1>Order Summary</h1>
  </div>

  <div class="content">
    <!-- Left side - Preview area -->
    <div class="preview-section">
      <h2 class="preview-title">Order Summary</h2>
      <div class="preview-container">
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>

    <!-- Right side - Order details -->
    <div class="order-details-section">
      <div class="detail-row">
        <span class="detail-label">Size:</span>
        <span class="detail-value" id="sizeDisplay">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Quantity:</span>
        <span class="detail-value" id="quantityDisplay">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">T-Shirt Color:</span>
        <span class="detail-value" id="tshirtColorDisplay">-</span>
      </div>
      <div class="detail-row" id="printSizeRow" style="display: none;">
        <span class="detail-label">Print Size:</span>
        <span class="detail-value" id="printSizeDisplay">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Type:</span>
        <span class="detail-value" id="typeDisplay">-</span>
      </div>

      <div class="total-price-container">
        <div class="total-price-row">
          <span class="total-price-label">Total Price</span>
          <span class="total-price-value" id="totalPriceDisplay">-</span>
        </div>
      </div>

      <button class="continue-button" id="continueButton">Continue to Payment</button>
    </div>
  </div>
</div>

<script>
  // Get URL parameters
  const urlParams = new URLSearchParams(window.location.search);
  const designId = urlParams.get('designId');
  
  // Get screenshot from sessionStorage (stored by Flutter editor)
  let previewImage = null;
  try {
    previewImage = sessionStorage.getItem('checkout_preview_image');
    console.log('Order Summary: Retrieved preview image from sessionStorage:', previewImage ? 'found (' + previewImage.length + ' chars)' : 'not found');
  } catch (e) {
    console.error('Order Summary: Error reading sessionStorage:', e);
  }
  
  const size = urlParams.get('size');
  const quantity = parseInt(urlParams.get('quantity') || '1');
  const price = parseFloat(urlParams.get('price') || '0');
  const type = urlParams.get('type');
  const printSize = urlParams.get('printSize');
  const tshirtColor = urlParams.get('tshirtColor');
  const imageX = parseFloat(urlParams.get('imageX') || '0');
  const imageY = parseFloat(urlParams.get('imageY') || '0');
  const imageScale = parseFloat(urlParams.get('imageScale') || '1');
  const imageRotation = parseFloat(urlParams.get('imageRotation') || '0');
  
  console.log('Order Summary: URL params - size:', size, 'quantity:', quantity, 'price:', price, 'type:', type, 'printSize:', printSize, 'tshirtColor:', tshirtColor);

  // Display order details
  document.getElementById('sizeDisplay').textContent = size || '-';
  document.getElementById('quantityDisplay').textContent = quantity.toString();
  document.getElementById('tshirtColorDisplay').textContent = tshirtColor === 'black' ? 'Black' : 'White';
  
  if (printSize) {
    document.getElementById('printSizeRow').style.display = 'flex';
    document.getElementById('printSizeDisplay').textContent = printSize.charAt(0).toUpperCase() + printSize.slice(1);
  }
  
  document.getElementById('typeDisplay').textContent = type || '-';
  document.getElementById('totalPriceDisplay').textContent = '$' + (price * quantity).toFixed(2);

  // Display preview screenshot
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');

  function drawPreview(imageData) {
    if (!imageData) {
      console.warn('Order Summary: No preview image data available');
      // Fallback: Show placeholder if no screenshot
      canvas.width = 500;
      canvas.height = 500;
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#666';
      ctx.font = '16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('No preview available', canvas.width / 2, canvas.height / 2);
      return;
    }

    // Use screenshot from Flutter editor (stored in sessionStorage)
    const previewImg = new Image();
    previewImg.onload = function() {
      console.log('Order Summary: Preview image loaded successfully, dimensions:', previewImg.width, 'x', previewImg.height);
      // Set canvas size to match screenshot
      canvas.width = previewImg.width;
      canvas.height = previewImg.height;
      
      // Draw the screenshot
      ctx.drawImage(previewImg, 0, 0);
      
      // Scale canvas for display if needed
      const maxDisplayWidth = 500;
      const maxDisplayHeight = 500;
      if (previewImg.width > maxDisplayWidth || previewImg.height > maxDisplayHeight) {
        const scaleX = maxDisplayWidth / previewImg.width;
        const scaleY = maxDisplayHeight / previewImg.height;
        const scale = Math.min(scaleX, scaleY);
        canvas.style.width = (canvas.width * scale) + 'px';
        canvas.style.height = (canvas.height * scale) + 'px';
      }
    };
    
    previewImg.onerror = function() {
      console.error('Order Summary: Failed to load preview screenshot from data URL');
      canvas.width = 500;
      canvas.height = 500;
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#666';
      ctx.font = '16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Failed to load preview image', canvas.width / 2, canvas.height / 2);
    };
    
    previewImg.src = imageData;
  }

  // Try to get preview image from sessionStorage
  drawPreview(previewImage);

  // Continue button handler
  const continueButton = document.getElementById('continueButton');
  continueButton.addEventListener('click', function() {
    // Build URL with order parameters
    const queryParams = new URLSearchParams();
    queryParams.set('size', size || '');
    queryParams.set('quantity', quantity.toString());
    queryParams.set('price', price.toFixed(2));
    queryParams.set('type', type || '');
    queryParams.set('tshirtColor', tshirtColor || '');
    
    if (printSize) {
      queryParams.set('printSize', printSize);
    }
    
    if (designId) {
      queryParams.set('designId', designId);
    }
    
    // Add image transformation parameters if available
    if (imageX !== 0) queryParams.set('imageX', imageX.toString());
    if (imageY !== 0) queryParams.set('imageY', imageY.toString());
    if (imageScale !== 1) queryParams.set('imageScale', imageScale.toString());
    if (imageRotation !== 0) queryParams.set('imageRotation', imageRotation.toString());
    
    // Navigate to preview/checkout page
    // For local dev: use /pages/preview.html, for production: use /pages/preview
    const isLocalDev = window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1';
    const previewPath = isLocalDev ? '/pages/preview.html' : '/pages/preview';
    
    const targetUrl = previewPath + '?' + queryParams.toString();
    console.log('Order Summary: Navigating to:', targetUrl);
    window.location.href = targetUrl;
  });
</script>
